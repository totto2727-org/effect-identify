# Configure npm trusted publishing before merging to main. See AGENTS.md.
name: Publish to npm

# Publish after changes merge into main. Tag pushes do not trigger publication.
on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        with:
          dev-shell: ci
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
      - name: Build npm artifact
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#ci")"
          vp pack
      - uses: totto2727-org/monorepo/.github/actions/publish-npm@main
        with:
          working-directory: .
          dev-shell: ci
